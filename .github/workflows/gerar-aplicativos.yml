# Gera automaticamente os aplicativos a cada envio para o GitHub:
#   - Android: FinancasPessoais.apk
#   - Windows: instalador .exe e versão portátil .exe
#   - Web (opcional): publica a versão PWA no GitHub Pages
# Os arquivos ficam em: aba "Actions" > execução mais recente > seção "Artifacts".
# Ao criar uma tag (ex.: v1.0.1) os arquivos também são anexados a uma "Release".
name: Gerar aplicativos

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Ícones e tela de abertura
        continue-on-error: true
        run: npm run android:icons

      - name: Versão do app
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Copiar interface para o Android
        run: npx cap sync android

      - name: Chave de assinatura fixa (permite atualizar o app sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FinancasPessoais.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: FinancasPessoais.apk

  windows:
    name: Windows (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Gerar instalador e versão portátil
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            desktop/dist/*.exe

  web:
    name: Versão web (GitHub Pages)
    runs-on: ubuntu-latest
    continue-on-error: true   # requer Pages disponível no repositório; não impede os apps
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publicar release (somente em tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: saida/*
