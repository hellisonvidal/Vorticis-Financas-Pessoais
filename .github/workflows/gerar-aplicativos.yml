# Gera automaticamente os aplicativos a cada envio para o GitHub:
#   - Android: FinancasPessoais.apk
#   - Windows: instalador .exe e versão portátil .exe
#   - Web (opcional): publica a versão PWA no GitHub Pages
# Os arquivos ficam em: aba "Actions" > execução mais recente > seção "Artifacts".
# Cada compilação no main também publica uma versão (Releases) com os arquivos anexados.
name: Gerar aplicativos

on:
  push:
    branches: [main, master, 'teste/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (já instalado no servidor do GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Ícones e tela de abertura
        continue-on-error: true
        run: npm run android:icons

      - name: Versão do app
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Número da versão na interface
        shell: bash
        run: sed -i "s/const VERSION = '[^']*'/const VERSION = '1.0.${{ github.run_number }}'/" www/js/views/config.js && grep -n "const VERSION" www/js/views/config.js

      - name: Copiar interface para o Android
        run: npx cap sync android

      - name: Chave de assinatura fixa (permite atualizar o app sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FinancasPessoais.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: FinancasPessoais.apk

  windows:
    name: Windows (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Número da versão na interface
        shell: bash
        run: sed -i "s/const VERSION = '[^']*'/const VERSION = '1.0.${{ github.run_number }}'/" www/js/views/config.js && grep -n "const VERSION" www/js/views/config.js

      - name: Instalar dependências
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Gerar instalador e versão portátil
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
          npm run dist

      - name: Testar instalador e versão portátil
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/testes/testar-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            desktop/dist/*.exe

  web:
    name: Versão web (GitHub Pages)
    # Opcional: ative em Settings > Pages > Source: "GitHub Actions" e crie a variável
    # PUBLICAR_WEB = true em Settings > Secrets and variables > Actions > Variables.
    if: vars.PUBLICAR_WEB == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publicar versão (release com .exe e .apk)
    needs: [android, windows]
    # ramos "teste/..." só compilam e testam, sem publicar versão
    if: ${{ !startsWith(github.ref, 'refs/heads/teste/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - name: Nome da versão
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT;
          else echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT; fi
          ls -la saida
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Finanças Pessoais ${{ steps.v.outputs.tag }}
          make_latest: true
          body: |
            **Windows:** `FinancasPessoais-Instalador-*.exe` (instala com atalho) ou `FinancasPessoais-Portatil-*.exe` (roda sem instalar).
            **Android:** `FinancasPessoais.apk` (instale por cima da versão anterior; seus dados são mantidos).
            Passo a passo de instalação e sincronização no arquivo LEIA-ME.md.
          files: saida/*
